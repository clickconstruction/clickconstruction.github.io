# Contact-form Worker for clickconstruction.com
# Deploy from this folder:  npx wrangler@4 deploy   (needs Node 22+)
name = "clickconstruction-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Public address of the Worker. Creates the DNS record on first deploy.
routes = [
  { pattern = "contact.clickconstruction.com", custom_domain = true }
]

# Sends mail through Cloudflare Email Routing. The From domain
# (FROM_ADDRESS below) must have Email Routing enabled and the
# destination must be a verified destination address on the account.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "robert@clickconstruction.com"

# Per-IP rate limit: 5 submissions per minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
FROM_ADDRESS = "contact@clicktooling.com"
TO_ADDRESS = "robert@clickconstruction.com"
SITE_ORIGIN = "https://clickconstruction.com"
ALLOWED_ORIGINS = "https://clickconstruction.com,https://www.clickconstruction.com"

# Optional secret, set with:  npx wrangler@4 secret put TURNSTILE_SECRET
# When present, every submission must carry a valid Turnstile token.
